server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    location /api/ {
        # Re-resolve the backend via Docker's DNS so a recreated backend
        # container (new IP) doesn't leave nginx stuck on a stale upstream.
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        # Stream NDJSON (thinking QA) chunk-by-chunk instead of buffering the whole response.
        proxy_buffering off;
        proxy_http_version 1.1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
